<svg width="400" height="400" viewBox="0 0 400 400"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="0" y="0" width="400" height="400"
        fill="white" />

  <!-- Outer lattice -->
  <rect x="50" y="50" width="300" height="300"
        fill="none"
        stroke="black"
        stroke-width="6" />

  <!-- Vertical lanes -->
  <line x1="150" y1="50" x2="150" y2="350"
        stroke="black"
        stroke-width="4" />

  <line x1="250" y1="50" x2="250" y2="350"
        stroke="black"
        stroke-width="4" />

  <!-- Horizontal markers -->
  <line x1="50" y1="150" x2="350" y2="150"
        stroke="black"
        stroke-width="2" />

  <line x1="50" y1="250" x2="350" y2="250"
        stroke="black"
        stroke-width="2" />

  <!-- Center evolution path -->
  <circle cx="200" cy="200" r="18"
          fill="white"
          stroke="black"
          stroke-width="4" />

</svg>
